[package]
name = "migration"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
sea-orm-migration = { version = "2.0", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
